<!DOCTYPE html>

<html lang="en">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Happy birthday</title>
   <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
         background: radial-gradient(circle, #e90000 0%, #000000e0 100%);

        text-align: center;
      color: #000000;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      font-size: clamp(2rem, 7vw, 3.5rem);
      text-shadow: 2px 2px 30px #00000055;
       font-family: 'Great Vibes', cursive;
      animation: fadeIn 4s ease-in-out;
    }

    h3 {
      font-size: clamp(1rem, 4vw, 1.5rem);
       font-family: 'Sacramento', cursive;
      text-shadow: 2px 2px 30px #00000055;
      margin: 20px;
      animation: fadeIn 4s ease-in-out;
    }
    .btn {
      margin-top: 30px;
      padding: 15px 40px;
      font-size: clamp(1rem, 4vw, 1.2rem);
      font-family: 'Parisienne', cursive;
      border: none;
      border-radius: 12px;
      background: #f62411;
      color: rgb(234, 218, 218);
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(255, 111, 97, 0.7);
      opacity:0;
      animation: fadeInPulse 2s ease forwards, pulse 2s infinite;
      animation-delay: 5s,5s; 
      
    }
    html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}
    
    
   @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
   }
     @keyframes fadeInPulse {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
   
   
   @keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
  }
   @media (max-width: 768px) {
    .btn {
      display: inline-block;
    }
  }
  </style>

  <style>
  
  @keyframes wiggle {
    0%   { transform: rotate(-15deg); }
    25%  { transform: rotate(-5deg); }
    50%  { transform: rotate(-15deg); }
    75%  { transform: rotate(-5deg); }
    100% { transform: rotate(-15deg); }
  }
  @keyframes pulse2 {
    0%   { transform: scale(1) rotate(15deg); }
    50%  { transform: scale(1.1) rotate(15deg); }
    100% { transform: scale(1) rotate(15deg); }
  }  
  
   .teddy {
    position: absolute;
    width: 170px;   
    height: 170px;
    
    position: absolute;
    width: 150px;
    top: 10%;
    right: 5%;
    animation: wiggle 3s infinite;
    
  }
   .roses {
    position: absolute;
    width: 170px;
    height: 170px;
    position: absolute;
    
    width: 150px;
    top: 65%;
    right: 70%;
    animation: pulse2 3s infinite;
  }

@media (max-width: 480px) {
    .teddy { width: 150px; top: 8%; right: 3%; }
    .roses { width: 150px; bottom: 9%; left: 3%; }
  }
</style>

<style>
  body {
    margin: 0;
    height: 100vh;
    
    overflow: hidden; /* no scrollbars */
    position: relative;
     
  }

  .heart {
    position: absolute;
    top: -50px;
    font-size: 24px;
    color: rgb(255, 0, 0);
    animation: fall linear infinite;
    z-index:-1;
  }

  @keyframes fall {
    0%   { transform: translateY(-50px); opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0; }
  }
</style>
<div class="heart" style="left:10%; animation-duration:6s; animation-delay:0s;">💞</div>
<div class="heart" style="left:25%; animation-duration:8s; animation-delay:2s;">🎀</div>
<div class="heart" style="left:40%; animation-duration:7s; animation-delay:1s;">💝</div>
<div class="heart" style="left:60%; animation-duration:9s; animation-delay:3s;">💗</div>
<div class="heart" style="left:80%; animation-duration:5s; animation-delay:4s;">💞</div>

<!-- Overlay -->
 <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<div id="loading" style="
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: radial-gradient(circle, #e90000 0%, #000000e0 100%);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:'Great Vibes', cursive;
  font-size:2em;
  color:#fff;
  z-index:9999;
  text-align:center;
">
  <div id="errorMsg">⚠️ Error: Something went wrong...<br><small>Please press again 🔄</small></div>
  <div id="kiddingMsg" style="display:none;">😅 Nothing is wrong,Just kidding...</div>
  <div id="typedMsg" style="display:none;"></div>
</div>

<style>
.fadeIn {
  animation: fadeIn 1s forwards;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
.shake {
  animation: shake 0.5s;
}
@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}
</style>

<script>
let pressCount = 0;

function typeSentence(sentence, elementId, delay, callback) {
  const el = document.getElementById(elementId);
  el.innerHTML = "";
  let i = 0;
  const interval = setInterval(() => {
    el.innerHTML += sentence.charAt(i);
    i++;
    if (i === sentence.length) {
      clearInterval(interval);
      if (callback) callback();
    }
  }, delay);
}

function startTransition() {
  pressCount++;
  document.getElementById("loading").style.display = "flex";

  // Reset
  document.getElementById("errorMsg").style.display = "none";
  document.getElementById("kiddingMsg").style.display = "none";
  document.getElementById("typedMsg").style.display = "none";

  if (pressCount < 3) {
    // First and second press → error + press again
    document.getElementById("errorMsg").style.display = "block";
    document.getElementById("errorMsg").classList.add("shake");
    setTimeout(() => {
      document.getElementById("loading").style.display = "none";
      document.getElementById("errorMsg").classList.remove("shake");
    }, 2000);
  } else {
    // Third press → error → kidding → typed sentences
    document.getElementById("errorMsg").style.display = "block";
    document.getElementById("errorMsg").classList.add("shake");

    setTimeout(() => {
      document.getElementById("errorMsg").style.display = "none";
      document.getElementById("kiddingMsg").style.display = "block";
      document.getElementById("kiddingMsg").classList.add("fadeIn");
    }, 2500);

    setTimeout(() => {
      document.getElementById("kiddingMsg").style.display = "none";
      document.getElementById("typedMsg").style.display = "block";
      // First typed line
      typeSentence(" sorry for trouble 💫, just choata sa majak😁😜 ", "typedMsg", 80, () => {
        setTimeout(() => {
          // Second typed line
          typeSentence("💖 Hold on, wifey ji... Something beautiful is opening just for you 🌹", "typedMsg", 80, () => {
            // Redirect after typing finishes
            setTimeout(() => {
              window.location.href = "birthday2.html";
            }, 2000);
          });
        }, 1500);
      });
    }, 5000);
  }
}
</script>

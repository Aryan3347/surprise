<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Scroll 💖</title>
<style>
body {
  margin: 0;
  height: 600vh;
  font-family: cursive;
  background: radial-gradient(circle, #e90000 0%, #000000e0 100%);
  color: #121212;
  overflow-x: hidden;
  overflow-y: hidden; /* lock scroll initially */
}

.section {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  
}

/* Heart animation */
.heart { font-size: 3em; animation: pulse 1.5s infinite; 
   font-size: 5em;
transform: scale(1.5);}
@keyframes pulse { 0%{transform:scale(1);color:#fff;}50%{transform:scale(1.2);color:#ff4d6d;}100%{transform:scale(1);color:#fff;} }

/* Typing animation */
.typing {
  border-right: 2px solid #0f0e0e;
  white-space: nowrap;
  overflow: hidden;
  font-size: 1.5em;
  font-family: cursive;
  animation: typing 4s steps(40,end), blinkCursor 0.8s infinite;
}
@keyframes typing { from{width:0;} to{width:100%;} }
@keyframes blinkCursor { from{border-color:transparent;} to{border-color:#660033;} }

/* Quiz styles */
.quiz-box { text-align:center; animation: fadeIn 1s;  }
.quiz-btn {
  padding:12px; font-size:1.2em; border:none; border-radius:8px;
  background:#ffdde1; color:#660033; margin:0.5em; animation: popIn 0.6s;
}
.quiz-btn:hover { background:#ee9ca7; cursor:pointer; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
@keyframes popIn { from{transform:scale(0.8);opacity:0;} to{transform:scale(1);opacity:1;} }

/* Split notes */
.note { display:flex; gap:0.3em; font-size:1.6em; }
.note span { opacity:0; }
.note.visible span.left { animation: slideLeft 0.8s forwards; }
.note.visible span.right { animation: slideRight 0.8s forwards; }
@keyframes slideLeft { from{transform:translateX(-100%);opacity:0;} to{transform:translateX(0);opacity:1;} }
@keyframes slideRight { from{transform:translateX(100%);opacity:0;} to{transform:translateX(0);opacity:1;} }

.note.visible span.top {
  animation: slideDown 0.8s forwards, pulse 1.5s infinite;
   position: absolute;
  top: 70vw;
  left: 30vw;
}

@keyframes slideDown {
  from { transform: translateY(-100%); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}


/* Dropping letters for Wifey */
.drop span { display:inline-block; opacity:0; transform:translateY(-150px); }
.drop.visible span { animation: dropIn 0.6s forwards; }
@keyframes dropIn { to{opacity:1;transform:translateY(0);} }

/* Punishment mini-game */
#gameBall { font-size:2em; position:relative; animation:bounce 1s infinite alternate; cursor:pointer; }
@keyframes bounce { from{top:0;} to{top:50px;} }
</style>
</head>
<body>

<!-- Section 1: Teaser -->
<div class="section" id="teaser">
  <div class="heart">❤️</div>
  <div class="typing">✨ Something else awaits First... ✨</div>
  <span style="font-size:0.8em; color:#080808;"> 👆</span>
</div>

<!-- Section 2: Quiz -->
<div class="section" id="quiz" style="display:none;">
  <div class="quiz-box">
    <h2 id="quizIntro">🧐 A small quiz awaits you...</h2>
    <div id="quizQuestion" style="display:none;">
      <p >What do you do to see reels?</p>
      <div id="options" style="display:flex; flex-direction:column; gap:1em; margin-top:1em;">
        <button class="quiz-btn" onclick="checkAnswer('scroll')">👉 Scroll</button>
        <button class="quiz-btn" onclick="checkAnswer('profile')">👤 Tap Profile</button>
        <button class="quiz-btn" onclick="checkAnswer('settings')">⚙️ Open Settings</button>
        <button class="quiz-btn" onclick="checkAnswer('wrong')">❌ Close App</button>
      </div>
      <p id="feedback" style="margin-top:1em; color:#b3003c;"></p>
    </div>
    <!-- Success note styled like other notes -->
    <div id="quizSuccess" class="note" style="display:none; font-size:1.4em; color:#00cc66;">
      <span class="left">🎉 You guessed</span><span class="right" > it right, do that same here please... </span>
     
  <span class="top" style="animation-delay:3s; "> Scrolll karoooo╰(*°▽°*)╯ </span>
    </div>
  </div>

</div>


<!-- Section 3: Funny notes -->
<div class="section">
   
  <div id="funny0" class="note" style="display:none;">
    <span class="left">😏 Just</span><span class="right"> reached...</span>
  </div>
</div>
<div class="section">
  <div id="funny1" class="note" style="display:none;">
    <span class="left">Ooh,</span><span class="right"> scroll more please...</span>
  </div>
</div>
<div class="section">
  <div id="funny2" class="note" style="display:none;">
    <span class="left">👇 Come on,</span><span class="right"> keep scrolling...</span>
  </div>
</div>

<!-- Section 4: About My Wifey -->
<div class="section">
  <div id="wifey" class="drop">
    <span>👑</span> <span>A</span><span>b</span><span>o</span><span>u</span><span>t</span> 
    <span>M</span><span>y</span> <span>W</span><span>i</span><span>f</span><span>e</span><span>y</span> <span>👑</span>
  </div>
</div>

<script>
let attempts = 0;

// After 5s hide teaser and show quiz intro
setTimeout(() => {
  document.getElementById("teaser").style.display = "none";
  document.getElementById("quiz").style.display = "flex";
  // After 2s show question and hide intro
  setTimeout(() => {
    document.getElementById("quizIntro").style.display = "none";
    document.getElementById("quizQuestion").style.display = "block";
  }, 2000);
}, 5000);

function checkAnswer(choice) {
  const feedback = document.getElementById("feedback");
  if (choice === "scroll") {
    // Correct answer
    document.getElementById("quizQuestion").style.display = "none";
    document.getElementById("quizIntro").style.display = "none"; // hide intro too
    const successNote = document.getElementById("quizSuccess");
    successNote.style.display = "flex";
    successNote.classList.add("visible");
    unlockNotes();
  } else {
    // Wrong answers
    attempts++;
    if (attempts === 1) {
      feedback.innerText = "😈 Wrong! Tap the bouncing ball to unlock another try!";
      let game = document.createElement("div");
      game.id = "gameBall";
      game.innerHTML = "🏀";
      game.onclick = () => {
        feedback.innerText = "Nice! You unlocked another try. Pick again!";
        game.remove();
      };
      feedback.appendChild(game);
    } else {
      feedback.innerText = "❌ Wrong again! But I’ll let you pass...";
      unlockNotes();
    }
  }
}

function unlockNotes() {
  document.body.style.overflowY = "scroll"; // unlock scroll
  document.getElementById("funny0").style.display = "flex";
  document.getElementById("funny1").style.display = "flex";
  document.getElementById("funny2").style.display = "flex";
}

// Animate notes when they enter viewport
function inView(el) {
  const rect = el.getBoundingClientRect();
  return rect.top < window.innerHeight * 0.8 && rect.bottom > 0;
}

window.addEventListener("scroll", () => {
  [funny0, funny1, funny2].forEach(note => {
    if (inView(note)) note.classList.add("visible");
  });

   // Lock scroll + trigger Wifey drop
  if (inView(wifey)) {
    document.body.style.overflowY = "hidden"; // lock scroll
    if (!wifey.classList.contains("visible")) {
      const spans = wifey.querySelectorAll("span");
      spans.forEach((span,i)=> {
        span.style.animationDelay = `${i*0.1}s`;
      });
      wifey.classList.add("visible");
      // unlock scroll again after 3 seconds
      setTimeout(()=> {
        document.body.style.overflowY = "scroll";
      }, 3000);
    }
  }
});
</script>

</body>
</html>
